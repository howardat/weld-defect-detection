[project]
name = "weld-pipeline"
version = "0.1.0"
description = "Weld inspection pipeline with YOLO and Gemma-3"
authors = [
    {name = "howardat", email = "olzhas.nurzhanovich.kakimzhanov@gmail.com"}
]
readme = "README.md"
# This range allows 3.11 and 3.12, which satisfies all your libs
requires-python = ">=3.11,<3.13"

dependencies = [
    "ultralytics>=8.3.0",
    "numpy>=1.26.0",
    "scikit-image>=0.24.0",
    "seaborn>=0.13.2",
    "pandas>=2.2.0",
    "torch (==2.10.0+cu126)",
    "torchvision (==0.25.0+cu126)",
    "transformers (>=4.49.0)",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "pillow>=10.4.0",
    "opencv-python>=4.10.0",
    "optuna>=3.6.0",
    "scikit-learn>=1.4.0",
    "torchaudio (==2.10.0+cu126)"
]

[tool.poetry]
# Keep this for Poetry 2.0 package discovery
packages = [{ include = "weld_pipeline", from = "src" }]

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
priority = "supplemental"

[tool.poetry.dependencies]
torch = {source = "pytorch-gpu"}
torchvision = {source = "pytorch-gpu"}
torchaudio = {source = "pytorch-gpu"}

[tool.pytest.ini_options]
testpaths = ["tests/porosity"]
addopts = "-q"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"